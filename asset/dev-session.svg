<svg width="900" height="190" viewBox="0 0 900 190" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  .label { font-size: 12px; fill: #7d8590; letter-spacing: 1.5px; }
  .main { font-size: 16px; fill: #e6edf3; }
  .dim { font-size: 13px; fill: #8b949e; }
  .green { fill: #3fb950; }
  .cursor { animation: blink 1.1s steps(1,end) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .scan { animation: scan 7s linear infinite; opacity: .18; }
  @keyframes blink { 0%,48% {opacity:1} 49%,100% {opacity:0} }
  @keyframes pulse { 0%,100% {opacity:.35} 50% {opacity:1} }
  @keyframes scan { from {transform:translateY(-150px)} to {transform:translateY(210px)} }
  @media (prefers-reduced-motion: reduce) {
    .cursor,.pulse,.scan { animation:none; }
  }
</style>

<rect x="1" y="1" width="898" height="188" rx="7" fill="#0d1117" stroke="#30363d"/>
<path d="M22 42H878" stroke="#21262d"/>
<path d="M575 57V166" stroke="#21262d"/>

<circle cx="24" cy="23" r="3.5" class="green pulse"/>
<text x="36" y="27" class="mono label">DEV SESSION</text>
<text x="780" y="27" class="mono label">ACTIVE</text>

<text x="26" y="69" class="mono label">WORK</text>
<text x="142" y="69" class="mono main">TypeScript / Phaser</text>

<text x="26" y="105" class="mono label">LEARNING</text>
<text x="142" y="105" class="mono main">C++ / Unreal Engine</text>

<text x="26" y="141" class="mono label">BUILDING</text>
<text x="142" y="141" class="mono main">AI Development Tools</text>

<text x="602" y="73" class="mono label">STATUS</text>
<text x="602" y="101" class="mono main">building &amp; learning</text>
<rect x="789" y="88" width="8" height="16" rx="1" fill="#3fb950" class="cursor"/>

<text x="602" y="137" class="mono dim">game / tools / automation</text>

<rect x="8" y="-160" width="884" height="42" fill="url(#scanGradient)" class="scan"/>
<defs>
  <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#3fb950" stop-opacity="0"/>
    <stop offset=".5" stop-color="#3fb950" stop-opacity=".18"/>
    <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
  </linearGradient>
</defs>

<path d="M18 14H34M18 14V30" stroke="#3fb950" stroke-opacity=".55"/>
<path d="M882 176H866M882 176V160" stroke="#3fb950" stroke-opacity=".55"/>
</svg>
